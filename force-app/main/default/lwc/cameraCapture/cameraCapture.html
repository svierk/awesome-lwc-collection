<template>
  <video class="video" autoplay playsinline></video>
  <canvas class="slds-hide canvas"></canvas>
  <lightning-button-group lwc:if={showControls} class="slds-show slds-var-m-top_small">
    <lightning-button
      data-id="start"
      label={labels.startCamera}
      icon-name="utility:video"
      onclick={handleStart}
    ></lightning-button>
    <lightning-button
      data-id="stop"
      label={labels.stopCamera}
      icon-name="utility:video_off"
      onclick={handleStop}
    ></lightning-button>
    <lightning-button
      data-id="capture"
      label={labels.capturePhoto}
      icon-name="utility:photo"
      onclick={handleCapture}
    ></lightning-button>
  </lightning-button-group>
</template>
