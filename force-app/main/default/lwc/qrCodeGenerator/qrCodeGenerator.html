<template>
  <lightning-card title="QR Code Generator" icon-name="utility:scan">
    <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
      <lightning-input
        data-id="url"
        type="url"
        label="Target URL"
        placeholder="https://example.com"
        value={url}
        onchange={handleUrlChange}
        class="slds-var-m-bottom_small"
      ></lightning-input>

      <div class="slds-grid slds-gutters slds-var-m-bottom_small">
        <div class="slds-col slds-size_1-of-2">
          <lightning-input
            data-id="color-dark"
            type="color"
            label="Dark Color"
            value={colorDark}
            onchange={handleColorDarkChange}
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-2">
          <lightning-input
            data-id="color-light"
            type="color"
            label="Light Color"
            value={colorLight}
            onchange={handleColorLightChange}
          ></lightning-input>
        </div>
      </div>

      <lightning-input
        data-id="file-input"
        type="file"
        label="Logo (optional)"
        onchange={handleFileUpload}
        class="slds-var-m-bottom_small"
      ></lightning-input>

      <template lwc:if={hasLogo}>
        <div class="logo-preview slds-theme_shade slds-var-p-around_x-small slds-var-m-bottom_medium">
          <img src={logoDataUrl} alt="Logo preview" class="logo-preview-image" />
          <lightning-button-icon
            icon-name="utility:close"
            alternative-text="Remove logo"
            variant="bare"
            size="small"
            onclick={handleRemoveLogo}
            class="remove-logo-btn"
          ></lightning-button-icon>
        </div>
      </template>

      <div>
        <lightning-button
          variant="brand"
          label="Generate QR Code"
          onclick={generateCode}
          disabled={isGenerateDisabled}
          class="slds-var-m-bottom_medium"
        ></lightning-button>
      </div>

      <div role="status">
        <p lwc:if={isHardToScan} data-id="contrast-hint" class="slds-text-color_weak slds-var-m-bottom_small">
          These colors may be hard to scan.
        </p>
      </div>

      <template lwc:if={isLoading}>
        <div class="slds-grid slds-grid_align-center slds-var-p-vertical_x-large">
          <lightning-spinner alternative-text="Generating..." size="medium"></lightning-spinner>
        </div>
      </template>

      <c-error-alert
        lwc:if={errorMessage}
        class="slds-show slds-var-m-top_small"
        message={errorMessage}
      ></c-error-alert>

      <template lwc:if={hasQRCode}>
        <div class="qr-code-container slds-grid slds-grid_align-center slds-var-p-around_medium slds-var-m-top_medium">
          <img src={qrCodeDataUrl} alt="Generated QR Code" class="qr-code-image" style={imageStyle} />
        </div>
        <lightning-button
          lwc:if={showSave}
          data-id="save"
          class="slds-show slds-var-m-top_small"
          variant="brand"
          label="Save"
          icon-name="utility:save"
          onclick={handleSave}
          disabled={isSaveDisabled}
        ></lightning-button>
      </template>
    </div>
  </lightning-card>
</template>
