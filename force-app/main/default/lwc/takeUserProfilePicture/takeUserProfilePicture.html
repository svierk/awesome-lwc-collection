<template>
  <lightning-card icon-name="utility:photo" title={labels.title}>
    <div class="slds-grid slds-gutters">
      <div class="slds-col slds-size_1-of-2">
        <div class="slds-p-left_small">
          <c-camera-capture camera={defaultCamera} hide-controls oncapture={handleCapture}></c-camera-capture>
        </div>
      </div>
      <div class="slds-col slds-size_1-of-2">
        <img
          lwc:if={photoDataUrl}
          src={photoDataUrl}
          class="slds-p-right_small preview"
          alt={labels.newProfilePreview}
        />
      </div>
    </div>
    <div slot="footer">
      <lightning-button-group>
        <lightning-button
          data-id="start"
          label={labels.startCamera}
          icon-name="utility:video"
          onclick={startCamera}
        ></lightning-button>
        <lightning-button
          data-id="stop"
          label={labels.stopCamera}
          icon-name="utility:video_off"
          onclick={stopCamera}
        ></lightning-button>
        <lightning-button
          data-id="capture"
          label={labels.capturePhoto}
          icon-name="utility:photo"
          onclick={capturePhoto}
        ></lightning-button>
        <lightning-button
          data-id="update"
          label={labels.updateProfile}
          icon-name="utility:save"
          onclick={updatePhoto}
          disabled={isUpdateDisabled}
          variant="brand"
        ></lightning-button>
      </lightning-button-group>
    </div>
  </lightning-card>
</template>
