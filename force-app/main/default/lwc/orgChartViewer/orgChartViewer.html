<template>
  <lightning-card title={labels.title} icon-name="utility:org_chart">
    <lightning-button
      slot="actions"
      data-id="expand-all"
      label={labels.expandAll}
      icon-name="utility:expand_all"
      onclick={handleExpandAll}
      disabled={isToolbarDisabled}
    ></lightning-button>
    <lightning-button
      slot="actions"
      data-id="collapse-all"
      label={labels.collapseAll}
      icon-name="utility:collapse_all"
      onclick={handleCollapseAll}
      disabled={isToolbarDisabled}
    ></lightning-button>
    <lightning-button
      slot="actions"
      data-id="fit"
      label={labels.fitToScreen}
      icon-name="utility:full_width_view"
      onclick={handleFit}
      disabled={isToolbarDisabled}
    ></lightning-button>
    <lightning-button
      slot="actions"
      data-id="export-png"
      variant="brand"
      label={labels.exportPng}
      icon-name="utility:download"
      onclick={handleExportPng}
      disabled={isToolbarDisabled}
    ></lightning-button>

    <lightning-input
      data-id="search-input"
      type="search"
      label={labels.search}
      variant="label-hidden"
      placeholder={labels.searchPlaceholder}
      value={searchTerm}
      onchange={handleSearchChange}
      disabled={isToolbarDisabled}
      class="search-input slds-var-p-horizontal_medium"
    ></lightning-input>

    <template lwc:if={isLibraryLoaded}>
      <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small slds-var-p-horizontal_medium">
        {nodeCountLabel}
      </p>
    </template>
    <p
      lwc:if={hasMoreRecords}
      data-id="more-records"
      class="slds-text-body_small slds-text-color_weak slds-var-p-horizontal_medium"
    >
      {moreRecordsLabel}
    </p>

    <c-error-alert
      lwc:if={errorMessage}
      class="slds-show slds-var-p-horizontal_medium slds-var-m-top_small"
      message={errorMessage}
    ></c-error-alert>

    <div class="slds-var-m-top_small">
      <div class="chart-wrapper slds-is-relative slds-scrollable_none">
        <div class="chart-container slds-size_full" data-id="chart-container" lwc:dom="manual"></div>
        <template lwc:if={showSpinner}>
          <div
            class="loading-overlay slds-is-absolute slds-grid slds-grid_align-center slds-grid_vertical-align-center"
          >
            <lightning-spinner alternative-text={labels.loading} size="medium"></lightning-spinner>
          </div>
        </template>
        <div
          lwc:if={showEmptyState}
          data-id="empty-state"
          class="loading-overlay slds-is-absolute slds-grid slds-grid_align-center slds-grid_vertical-align-center"
        >
          <p>{labels.noRecords}</p>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
