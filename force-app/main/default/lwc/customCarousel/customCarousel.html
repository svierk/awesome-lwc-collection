<template>
  <c-error-alert lwc:if={errorMessage} class="slds-show slds-m-bottom_small" message={errorMessage}></c-error-alert>
  <div
    role="region"
    aria-roledescription="carousel"
    aria-label="Image carousel"
    onkeydown={handleKeyDown}
    onfocusin={handleFocusIn}
    onmouseenter={handleMouseEnter}
    onmouseleave={handleMouseLeave}
    onpointerdown={handlePointerPress}
    onpointerup={handlePointerRelease}
  >
    <div class="slds-is-relative container" style={maxWidth}>
      <div
        class="carousel-viewport"
        onpointerdown={handlePointerDown}
        onpointerup={handlePointerUp}
        onpointercancel={handlePointerCancel}
      >
        <div class={trackClass} style={trackStyle}>
          <template for:each={slidesData} for:item="slide">
            <div
              key={slide.index}
              class={slide.slideClass}
              role="group"
              aria-roledescription="slide"
              lwc:spread={slide.slideAria}
            >
              <div lwc:if={showSlideNumber} class="slideNumbers slds-is-absolute">
                {slide.index}/{slidesData.length}
              </div>
              <img src={slide.image} alt={slide.description} style={maxHeight} draggable="false" />
              <div
                lwc:if={showSlideText}
                class="text-section slds-var-p-around_medium slds-is-absolute slds-size_full slds-text-align_center"
              >
                <h3 class="slds-text-heading_large">{slide.heading}</h3>
                <div class="slds-text-heading_small">{slide.description}</div>
              </div>
            </div>
          </template>
        </div>
      </div>
      <button
        lwc:if={showNavigationButtons}
        type="button"
        class="prev slds-is-absolute"
        title="Previous slide"
        aria-label="Previous slide"
        onclick={slideBackward}
      >
        &#10094;
      </button>
      <button
        lwc:if={showNavigationButtons}
        type="button"
        class="next slds-is-absolute"
        title="Next slide"
        aria-label="Next slide"
        onclick={slideForward}
      >
        &#10095;
      </button>
    </div>
    <div lwc:if={showControls} class="carousel-controls slds-text-align_center slds-var-p-around_medium">
      <lightning-button-icon
        lwc:if={showPlaybackButton}
        class="carousel-playback slds-m-right_x-small"
        variant="bare"
        icon-name={playbackIcon}
        alternative-text={playbackLabel}
        title={playbackLabel}
        onclick={togglePlayback}
      ></lightning-button-icon>
      <template lwc:if={showNavigationDots}>
        <template for:each={slidesData} for:item="slide">
          <button
            key={slide.index}
            type="button"
            class={slide.dotClass}
            data-id={slide.index}
            aria-label={slide.dotLabel}
            lwc:spread={slide.dotAria}
            onclick={showSlide}
          ></button>
        </template>
      </template>
    </div>
    <output class="slds-assistive-text">{announcement}</output>
  </div>
</template>
