<template>
  <c-error-alert lwc:if={errorMessage} class="slds-show slds-m-bottom_small" message={errorMessage}></c-error-alert>
  <div class="slds-form-element">
    <label lwc:if={label} class="slds-form-element__label" for="combobox-input">
      <abbr lwc:if={required} title="required" class="slds-required">*</abbr>
      {label}</label
    >
    <div class="slds-form-element__control">
      <div class="slds-combobox_container">
        <div class={dropdownClass}>
          <div class="slds-combobox_form-element slds-input-has-icon slds-input-has-icon_right" role="none">
            <input
              id="combobox-input"
              class="slds-combobox__input multi-select-combobox__input"
              aria-label={inputLabel}
              aria-controls="combobox-listbox"
              aria-expanded="false"
              aria-haspopup="listbox"
              lwc:spread={inputAria}
              onkeydown={handleKeyDown}
              role="combobox"
              type="text"
              value={selectedItems}
              required={required}
              disabled={isDisabled}
              readonly
            />
            <span
              class="slds-icon_container slds-icon-utility-down slds-input__icon slds-input__icon_right multi-select-combobox__icon"
              title="Click to open the dropdown"
            >
              <lightning-icon
                icon-name="utility:down"
                size="xx-small"
                alternative-text="Click here"
                class="slds-icon slds-icon_selected slds-icon_x-small slds-icon-text-default"
              >
              </lightning-icon>
            </span>
          </div>
          <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid multi-select-combobox__listbox">
            <label lwc:if={enableSearch} class="slds-assistive-text" for="multi-select-combobox-search">Search</label>
            <input
              lwc:if={enableSearch}
              id="multi-select-combobox-search"
              class="multi-select-combobox__search"
              type="text"
              placeholder="Search..."
              value={_searchTerm}
              oninput={handleSearch}
              onkeydown={handleKeyDown}
              onclick={handleSearchClick}
            />
            <ul
              id="combobox-listbox"
              class="slds-listbox slds-listbox_vertical"
              aria-label={inputLabel}
              lwc:spread={listboxAria}
            >
              <template for:each={filteredOptions} for:item="item">
                <c-multi-select-combobox-item
                  key={item.value}
                  item={item}
                  onchange={handleChange}
                  onkeydown={handleKeyDown}
                >
                </c-multi-select-combobox-item>
              </template>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <div lwc:if={hasPillsEnabled}>
      <lightning-pill-container
        lwc:if={isVisible}
        items={selectedOptions}
        variant="bare"
        onitemremove={handleRemove}
      ></lightning-pill-container>
    </div>
  </div>
</template>
