<template>
  <div class={cardClass}>
    <div lwc:if={showCard} class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__figure">
          <lightning-icon icon-name={cardIcon} size="small"></lightning-icon>
        </div>
        <div class="slds-media__body">
          <h2 lwc:if={cardTitle} class="slds-card__header-title">
            <span class="slds-truncate" title={cardTitle}>{cardTitle}</span>
          </h2>
        </div>
      </header>
    </div>
    <div class={cardBodyClass}>
      <c-error-alert lwc:if={errorMessage} class="slds-show slds-m-bottom_small" message={errorMessage}></c-error-alert>
      <div class="container" style={containerStyle} lwc:dom="manual"></div>
    </div>
  </div>
</template>
