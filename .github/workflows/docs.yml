name: Docs

# Builds the VitePress documentation site and deploys it to GitHub Pages.
# The component catalog is regenerated from the component READMEs and images of
# this repository by the docs generator on every build.

on:
  push:
    branches: [main]
    paths:
      - 'force-app/main/default/lwc/**/README.md'
      - 'images/**'
      - 'docs/**'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# No permissions by default; each job below grants only what it needs.
permissions: {}

# Allow only one concurrent Pages deployment, without cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # required for the "last updated" timestamps
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # NODE_VERSION_OVERRIDE is a repository variable; unset it to fall back
      # to engines.node from package.json, populate it to pin a version
      # without touching this workflow file.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.2
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Docs
        run: npm run docs:build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
