name: Validation

# Validates changes to this repository: runs the static quality gate (Prettier,
# ESLint, component READMEs) and, wherever secrets are available, runs the
# Salesforce Code Analyzer, deploys the metadata to the target org and runs the
# Apex and LWC tests against it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  # External pull requests from forks have no access to secrets, so they run a
  # secret-free, static-only pipeline. This job runs *only* in that context.
  static:
    name: Static Checks
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # NODE_VERSION_OVERRIDE is a repository variable; unset it to fall back
      # to engines.node from package.json, populate it to pin a version
      # without touching this workflow file.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.2
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Check Component READMEs
        run: npm run lint:readme

      - name: Test Docs Scripts
        run: npm run test:docs

      - name: Code Review
        uses: svierk/sfdx-code-review@v1.1.0
        with:
          code-analyzer: 'false'
          prettier: 'true'
          eslint: 'true'
          prettier-command: npm run prettier:verify
          eslint-command: npm run lint:sonar # writes the report the job summary reads the error/warning counts from

      - name: Run Tests
        uses: svierk/sfdx-run-tests@v1.1.1
        with:
          apex: false
          lwc: true
          flow: false

  # Pushes, manual runs and internal pull requests (including Dependabot) have
  # access to secrets and run the full validation. This job runs in every
  # context except pull requests from forks.
  validation:
    name: Org Validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Read the repository, plus write the Code Analyzer results back as a SARIF
    # report (required by the Upload SARIF step).
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # required for the delta detection and the Sonar analysis
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # NODE_VERSION_OVERRIDE is a repository variable; unset it to fall back
      # to engines.node from package.json, populate it to pin a version
      # without touching this workflow file.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.2
        with:
          node-version: ${{ vars.NODE_VERSION_OVERRIDE }}

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Check Component READMEs
        run: npm run lint:readme

      - name: Test Docs Scripts
        run: npm run test:docs

      # Installed before the Code Review, which runs the Code Analyzer as a
      # plugin of the SF CLI.
      - name: Install SF CLI
        uses: svierk/sfdx-cli-setup@v1.1.3

      # Prettier and ESLint fail the job, and so does any Code Analyzer finding
      # of Moderate severity or higher. All findings, including the Low and
      # Info ones below the threshold, are reported in the Security tab.
      - name: Code Review
        uses: svierk/sfdx-code-review@v1.1.0
        with:
          code-analyzer: 'true'
          prettier: 'true'
          eslint: 'true'
          workspace: force-app
          config-file: code-analyzer.yml
          output-file: results.sarif
          severity-threshold: '3'
          prettier-command: npm run prettier:verify
          eslint-command: npm run lint:sonar

      # Also runs when Prettier or ESLint failed the Code Review, as long as the
      # Code Analyzer wrote its report.
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: results.sarif

      - name: Salesforce Org Login
        uses: svierk/sfdx-login@v1.4.3
        with:
          client-id: ${{ secrets.SFDX_CONSUMER_KEY }}
          jwt-secret-key: ${{ secrets.SFDX_JWT_SECRET_KEY }}
          username: ${{ vars.SFDX_USERNAME }}

      - name: Deploy Metadata
        uses: svierk/sfdx-deploy@v1.2.2

      - name: Run Tests
        uses: svierk/sfdx-run-tests@v1.1.1
        with:
          apex: true
          lwc: true
          flow: false # enable once Flow tests exist in the project

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Codecov Coverage Upload
        uses: codecov/codecov-action@v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
